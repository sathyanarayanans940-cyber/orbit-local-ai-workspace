<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Sign in · Orbit</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/login.css"></head>
<body><main><img src="/icon.svg" width="44" height="44" alt=""><h1>Your Orbit, anywhere.</h1><p>Sign in to your personal cloud workspace.</p><form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">Orbit password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button type="submit">Open Orbit <span aria-hidden="true">↗</span></button></form><p class="note">Cloud models · No Ollama installation needed</p><p class="note">Chats and memories stay in this browser. Use your own device.</p></main></body></html>
