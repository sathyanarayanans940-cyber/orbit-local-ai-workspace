<!doctype html><meta charset="utf-8"><title>Orbit worked solutions audit</title>
<style>body{font:16px system-ui;background:#e9edf2;color:#243244;margin:24px}button,a{margin-right:16px}button{padding:10px 16px;border:1px solid #bcc7d5;border-radius:8px;background:white}iframe{width:100%;height:1050px;border:0}canvas{display:block;margin:24px auto;max-width:100%;height:auto;box-shadow:0 2px 12px #17233420}#status{white-space:pre-wrap}</style>
<h1>Complete working and editable formulas</h1>
<p>Manually authored QA fixture from the supplied statistics paper. This tests Orbit’s exporter and viewer, not a live model reply.</p>
<button id="build">Build in browser</button><button id="word" disabled>Show Word preview</button><button id="pdf" disabled>Show PDF pages</button>
<p id="status">Ready. First run ORBIT_WIDGET_QA=1 node --test tests/worked-solutions.test.cjs to create the input fixture.</p><p id="downloads"></p><main id="preview"></main>
<script src="/vendor/widgets/engine.js?v=23"></script><script src="/widgets.js?v=46"></script>
<script type="module">
import * as pdfjs from '/vendor/readers/pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc='/vendor/readers/pdf.worker.min.mjs';
let wordHtml,documentPdf;
const status=document.querySelector('#status'),preview=document.querySelector('#preview');
document.querySelector('#build').onclick=async()=>{try{
 status.textContent='Building Word and PDF with the shipped engine…';
 const response=await fetch('/tests/output/worked-solutions/spec.json');if(!response.ok)throw Error('Create the QA input fixture first.');
 const spec=await response.json(),engine=await OrbitWidgets.engine(),word=await OrbitWidgets.generate(spec),pdf=await OrbitWidgets.generate({...spec,kind:'pdf'});
 wordHtml=await engine.wordPreview(word);documentPdf=await pdfjs.getDocument({data:new Uint8Array(await pdf.arrayBuffer())}).promise;
 for(const [kind,blob] of [['docx',word],['pdf',pdf]]){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Worked statistics.'+kind;a.textContent='Download '+kind.toUpperCase();document.querySelector('#downloads').append(a);}
 const formulas=spec.blocks.filter(b=>b.type==='formula');
 const wordText=new DOMParser().parseFromString(wordHtml,'text/html').body.textContent.replace(/\s+/g,' ');
 if(formulas.some(b=>!wordText.includes(b.text.replace(/\s+/g,' '))))throw Error('Word preview lost formula text.');
 let text='';for(let i=1;i<=documentPdf.numPages;i++)text+=(await (await documentPdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ');
 for(const token of ['50.288889','0.951515','0.992489602','33.2340079034','0.010890731'])if(!text.includes(token))throw Error('PDF lost result '+token);
 status.textContent=`PASS: ${formulas.length} centered text formulas retained in Word; ${documentPdf.numPages} PDF pages; all selected results retained. No LaTeX/image conversion used for formulas.`;
 document.querySelector('#word').disabled=false;document.querySelector('#pdf').disabled=false;document.querySelector('#pdf').click();
}catch(e){status.textContent='FAIL: '+e.message;}};
document.querySelector('#word').onclick=()=>{preview.replaceChildren();const frame=document.createElement('iframe');frame.title='Word layout preview';frame.sandbox='';frame.srcdoc=wordHtml;preview.append(frame);};
document.querySelector('#pdf').onclick=async()=>{preview.replaceChildren();for(let i=1;i<=documentPdf.numPages;i++){const page=await documentPdf.getPage(i),viewport=page.getViewport({scale:1.25}),canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;canvas.setAttribute('aria-label','PDF page '+i);preview.append(canvas);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;}};
</script>
